site_name: Team 9776C - Smash n' Dash
site_description: Engineering Notebook for VEX Robotics Team 9776C
site_author: Team 9776C
site_url: https://yourusername.github.io/Notebook-Private/

# Repository
repo_name: yourusername/Notebook-Private
repo_url: https://github.com/yourusername/Notebook-Private

# Theme configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

# Additional JavaScript for math rendering
extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Plugins
plugins:
  - search
  - glightbox

# Navigation structure
nav:
  - Home: index.md
  - Overview: overview.md
  - Original Bot:
    - Overview: original-bot/index.md
  - New Bot:
    - Overview: new-bot/index.md
    - Drivetrain:
      - Overview: new-bot/drivetrain/index.md
      - Speed: new-bot/drivetrain/speed.md
      - Anti-Push: new-bot/drivetrain/anti-push.md
      - PTO: new-bot/drivetrain/PTO.md
      - Parking: new-bot/drivetrain/parking.md
      - Size: new-bot/drivetrain/size.md
      - Aligner: new-bot/drivetrain/aligner.md
      - Misc: new-bot/drivetrain/misc.md
      - Design: new-bot/drivetrain/08-design.md
    - Scoring:
      - Overview: new-bot/scoring/index.md
      - Arc Scoring: new-bot/scoring/arc-scoring.md
      - Linear Scoring: new-bot/scoring/linear-scoring.md
      - S Scoring: new-bot/scoring/S-scoring.md
      - C Scoring: new-bot/scoring/C-scoring.md
    - Intake: new-bot/intake/index.md
    - Descoring: new-bot/descoring/index.md
    - Color Sorting: new-bot/color-sorting/index.md
    - Match Loader: new-bot/match-loader/index.md
    - Odometry: new-bot/odom/index.md
    - Code: new-bot/code/index.md
    - Design: new-bot/design/index.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername
